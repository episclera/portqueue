name: production

# Release the public packages to npm on main, driven by release-please and Conventional Commits.
# Every push to main updates one open release PR (version bump + CHANGELOG, derived from the commit
# messages). Merging that PR is the release: the push it makes creates the GitHub releases and tags,
# and only then does this job publish. Any other push publishes nothing.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Build first: the workspace packages are symlinked from this checkout, and core/dashboard
      # expose their types from dist/, so lint and tests type-check against the code just built.
      - run: npm run build
      - run: npm run lint
      - run: npm test
      # Opens/updates the release PR, or — on the merge of that PR — tags and creates the releases.
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Print each tarball's file list into the log before it ships.
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: npm pack --dry-run -w @portqueue/core -w @portqueue/dashboard -w @portqueue/cli
      # dist/ was built above from this same commit, so publish ships exactly what was tested.
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
