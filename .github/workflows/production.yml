name: production

# Everything that ships to the production environment: the npm packages and the docs site. One
# workflow per environment, not one per artifact — the docs depend on more than their own files (the
# API reference, typed samples, the packages' sources), so they deploy with the release rather than
# behind a paths filter that can miss a change.
#
# npm is driven by release-please and Conventional Commits. Every push to main updates one open
# release PR (version bump + CHANGELOG, derived from the commit messages). Merging that PR is the
# release: the push it makes creates the GitHub releases and tags, and only then does this job
# publish. Any other push publishes nothing to npm.
#
# The docs deploy only after that publish succeeds: the site documents the published API, so a push
# that ships no packages deploys no docs, and the site never describes a version npm doesn't have.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Build first: the workspace packages are symlinked from this checkout, and core/dashboard
      # expose their types from dist/, so lint and tests type-check against the code just built.
      # The root build includes the docs site, so docs/build comes from this same commit.
      - run: npm run build
      - run: npm run lint
      - run: npm test
      # Opens/updates the release PR, or — on the merge of that PR — tags and creates the releases.
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Print each tarball's file list into the log before it ships.
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: npm pack --dry-run -w @portqueue/core -w @portqueue/dashboard -w @portqueue/cli
      # dist/ was built above from this same commit, so publish ships exactly what was tested.
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Uploaded only after a successful publish, so the site below is never ahead of npm.
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  # Deploys the site built and tested in `release` to GitHub Pages — only on a release, and only once
  # the packages it documents are on npm (`needs: release` waits for the publish step to succeed).
  deploy-docs:
    needs: release
    if: ${{ needs.release.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
