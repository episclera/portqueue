name: production

# Everything that ships to the production environment: the npm packages and the docs site. One
# workflow per environment, not one per artifact — the docs depend on more than their own files (the
# API reference, typed samples, the packages' sources), so they deploy with the release rather than
# behind a paths filter that can miss a change.
#
# Three jobs, each gated on the one before it:
#   validate     install → build → lint → test, then hands the build on as artifacts: the packages'
#                dist/ for publish, docs/build for deploy-docs. Nothing later rebuilds, so what ships
#                is byte-for-byte what was tested.
#   publish      scripts/ci_cd/release-commit.mjs reads the Conventional Commits since the last
#                `chore(release): …` commit, picks the bump, writes the one shared version into
#                core/dashboard/cli and CHANGELOG.md and commits that as
#                `chore(release): x.y.z [skip ci]`. The job pushes that commit to main, then
#                publishes the dist/ from validate. Every push to main is a release — there is no
#                release PR, and no tag: git history is the only release state. The release commit is
#                pushed with GITHUB_TOKEN, which never triggers another run.
#   deploy-docs  only when publish actually released, so the site never describes a version npm
#                doesn't have, and a push that ships no packages deploys no docs.
#
# Reusing the build across the version bump is safe because nothing built embeds the version: the
# release commit changes only package.json versions, the lockfile and CHANGELOG.md.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      # Build first: the workspace packages are symlinked from this checkout, and core/dashboard
      # expose their types from dist/, so lint and tests type-check against the code just built.
      # The root build includes the docs site, so docs/build comes from this same commit.
      - run: npm run build
      - run: npm run lint
      - run: npm test
      # The published packages' build, restored into the same paths by publish.
      - uses: actions/upload-artifact@v4
        with:
          name: packages-dist
          path: |
            packages/core/dist
            packages/dashboard/dist
            packages/cli/dist
          if-no-files-found: error
          retention-days: 1
      # The docs site, picked up by deploy-docs — which only runs once the packages are on npm.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.released.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The release script reads every commit since the last release commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org
      # For the workspace links npm publish resolves — no build.
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
      # Bumps, changelogs and commits — or reports released=false when there is nothing to release.
      - id: released
        run: npm run release:commit
      # Pushed before publishing: a main that moved on rejects the push, and nothing reaches npm.
      - if: ${{ steps.released.outputs.released == 'true' }}
        run: git push origin HEAD:main
      # The dry-run pack prints each tarball's file list into the log before it goes out.
      - if: ${{ steps.released.outputs.released == 'true' }}
        run: npm pack --dry-run -w @portqueue/core -w @portqueue/dashboard -w @portqueue/cli && npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Deploys the site built and tested in validate — only on a release, and only once the packages it
  # documents are on npm.
  deploy-docs:
    needs: publish
    if: ${{ needs.publish.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
