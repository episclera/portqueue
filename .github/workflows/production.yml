name: production

# Everything that ships to the production environment: the npm packages and the docs site. One
# workflow per environment, not one per artifact — the docs depend on more than their own files (the
# API reference, typed samples, the packages' sources), so they deploy with the release rather than
# behind a paths filter that can miss a change.
#
# npm is driven by semantic-release and Conventional Commits (release.config.mjs), and every push to
# main is a release — there is no release PR. It reads the commits since the last `v<version>` tag,
# picks the bump, writes the one shared version into core/dashboard/cli and CHANGELOG.md, commits that
# back as `chore(release): x.y.z [skip ci]`, tags it, creates the GitHub release and publishes. The
# release commit is pushed with GITHUB_TOKEN, which never triggers another workflow run, so a release
# cannot loop into a second one.
#
# The docs deploy only after that publish succeeds: the site documents the published API, so a push
# that ships no packages deploys no docs, and the site never describes a version npm doesn't have.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.released.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads every commit and tag since the last release.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Build first: the workspace packages are symlinked from this checkout, and core/dashboard
      # expose their types from dist/, so lint and tests type-check against the code just built.
      # The root build includes the docs site, so docs/build comes from this same commit.
      - run: npm run build
      - run: npm run lint
      - run: npm test
      # Bumps, changelogs, commits, tags and publishes — or does nothing when there is nothing to
      # release. dist/ was built above from this same commit, so publish ships exactly what was tested.
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # A release leaves HEAD on the tagged release commit; no release leaves it untagged.
      - id: released
        run: |
          if [ -n "$(git tag --points-at HEAD 'v*')" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
      # Uploaded only after a successful publish, so the site below is never ahead of npm.
      - if: ${{ steps.released.outputs.released == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  # Deploys the site built and tested in `release` to GitHub Pages — only on a release, and only once
  # the packages it documents are on npm (`needs: release` waits for the publish step to succeed).
  deploy-docs:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
