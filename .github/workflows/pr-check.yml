name: pr-check

# Lint + typecheck + test + build on pull requests. The job is `validate`, the same name and the same
# checks as production.yml's first job. Pushes to main are not checked here: production.yml's
# validate job does that before anything ships, so main is never tested twice.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      # Build first: the workspace packages are symlinked from this checkout, and core/dashboard
      # expose their types from dist/, so lint and tests type-check against the code just built.
      - run: npm run build
      - run: npm run lint
      - run: npm test
