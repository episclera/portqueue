name: publish

# Publish the public packages to npm on main, driven by Changesets.
# The changelog/version commit is created by the changesets action and does NOT re-trigger
# this workflow into a publish loop (the release PR flow separates version from publish).
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Build first: the workspace packages are symlinked from this checkout, and core/dashboard
      # expose their types from dist/, so lint and tests type-check against the code just built.
      - run: npm run build
      - run: npm run lint
      - run: npm test
      # Creates/updates the release PR, or publishes when the release PR is merged.
      - uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
